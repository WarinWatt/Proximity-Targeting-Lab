<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีของฉัน · Proximity Ads</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-shell.css"></head><body>
<main class="account-main"><h1>บัญชีของฉัน</h1><p>จัดการข้อมูลติดต่อและความปลอดภัยของบัญชี</p><p id="status" role="status" aria-live="polite">กำลังโหลดบัญชี…</p>
<section class="login-card" aria-labelledby="profile-title"><h2 id="profile-title">ข้อมูลส่วนตัว</h2>
<p id="profile-identity"></p><p id="profile-roles"></p><p id="profile-demo" class="account-demo-note" hidden>บัญชีทดลอง · ข้อมูลและสิทธิ์ใช้งานมีอายุจำกัด</p>
<form id="profile"><fieldset id="profile-fields" disabled>
<label for="display-name">ชื่อที่แสดง</label><input id="display-name" name="display_name" autocomplete="name" required>
<label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email" required>
<h3>เปลี่ยนรหัสผ่าน</h3><p class="login-help">เว้นว่างหากต้องการใช้รหัสผ่านเดิม</p>
<label for="current-password">รหัสผ่านปัจจุบัน</label><input id="current-password" name="current_password" type="password" autocomplete="current-password">
<label for="password">รหัสผ่านใหม่</label><input id="password" name="password" type="password" autocomplete="new-password">
<label for="confirm-password">ยืนยันรหัสผ่านใหม่</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password">
<button id="profile-submit" class="primary" type="submit">บันทึกข้อมูล</button>
</fieldset></form></section></main><script type="module" src="profile.mjs"></script><script type="module" src="ui-shell.mjs"></script><script type="module" src="session-bar.mjs"></script></body></html>
